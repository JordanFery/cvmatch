name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Dummy but syntactically valid values — this job validates that the
      # code compiles/builds/lints, it never talks to a real database, LLM,
      # or Stripe account. Real secrets live only in the hosting platform's
      # (Vercel) environment variables, never here.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      STRIPE_PRICE_ESSENTIAL: "price_ci_placeholder"
      STRIPE_PRICE_PRO: "price_ci_placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm test

      - run: npm run build
